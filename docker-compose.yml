services:

  postgres:
    image: postgres:17
    container_name: sistema-os-db
    environment:
      POSTGRES_DB: OS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: sistema-os-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/OS
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
    depends_on:
      - postgres

volumes:
  postgres_data: