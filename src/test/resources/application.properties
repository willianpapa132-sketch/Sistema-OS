JWT_SECURITY=test-secret-with-enough-entropy-for-security-tests
DB_PASSWORD=123456
spring.application.name=demo
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/OS
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
api.security.token.secret=${JWT_SECURITY}
api.cors.allowed-origins=http://localhost:3000,http://localhost:5173
