spring.application.name=demo

#
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/OS
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:123456}

api.security.token.secret=${JWT_SECURITY:dev-secret-with-enough-entropy-for-local-development}
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
