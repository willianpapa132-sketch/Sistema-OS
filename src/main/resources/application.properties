spring.application.name=demo

#
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/OS
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:123456}

api.security.token.secret=${JWT_SECURITY:dev-secret-with-enough-entropy-for-local-development}
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,null}

app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.security.bootstrap-admin.login=${BOOTSTRAP_ADMIN_LOGIN:dev_admin}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
